# 复制为 packages/android/keystore.properties（已 gitignore）或
# ~/.gradle/zcode-android-release.properties，填入真实值后执行 assembleRelease。
# 生成 keystore:
#   keytool -genkeypair -v -keystore zcode-release.jks -keyalg RSA -keysize 2048 \
#     -validity 10000 -alias zcode
ZCODE_ANDROID_STORE_FILE=/absolute/path/to/zcode-release.jks
ZCODE_ANDROID_STORE_PASSWORD=changeit
ZCODE_ANDROID_KEY_ALIAS=zcode
ZCODE_ANDROID_KEY_PASSWORD=changeit
