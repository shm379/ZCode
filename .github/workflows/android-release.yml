# Android release pipeline (fork-owned; see FORK.md).
#
# Trigger: on pushing a mobile-v* tag (e.g. mobile-v1.0.0), build a signed APK/AAB
# and publish a GitHub Release. workflow_dispatch builds only (no release step) so a
# manual run from a branch can never mint a stray tag or publish artifacts outside
# the mobile-v* line.
# Signing: the keystore is stored base64-encoded in the repo secret
#       ZCODE_ANDROID_STORE_FILE_BASE64; passwords live in
#       ZCODE_ANDROID_STORE_PASSWORD / ZCODE_ANDROID_KEY_PASSWORD, alias in
#       ZCODE_ANDROID_KEY_ALIAS (defaults to zcode when unset).
#       The keystore itself and any properties file containing passwords never enter the
#       repo (see packages/android/.gitignore).
#
# publish-nabux (optional, neutral by default): runs only when the repo secret
#   NABUX_APKHUB_TOKEN exists; it calls scripts/publish-apk-nabuxai.mjs --enqueue to
#   queue a build on apk.nabuxai.com.
#   Note: that site has no public API docs, and a hub admin must first register the
#   app server-side (see the script header); without the secret this job skips and
#   the release is unaffected.

name: android-release

on:
  push:
    tags:
      - 'mobile-v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-release:
    runs-on: ubuntu-latest
    outputs:
      nabux_enabled: ${{ steps.nabux_gate.outputs.nabux_enabled }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Detect optional Nabu APK Hub publish gate
        id: nabux_gate
        env:
          NABUX_APKHUB_TOKEN: ${{ secrets.NABUX_APKHUB_TOKEN }}
        run: |
          # Never echo the token value; only check whether it is configured
          if [ -n "$NABUX_APKHUB_TOKEN" ]; then
            echo "nabux_enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "nabux_enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Restore signing keystore from secret
        env:
          ZCODE_ANDROID_STORE_FILE_BASE64: ${{ secrets.ZCODE_ANDROID_STORE_FILE_BASE64 }}
          ZCODE_ANDROID_STORE_PASSWORD: ${{ secrets.ZCODE_ANDROID_STORE_PASSWORD }}
          ZCODE_ANDROID_KEY_ALIAS: ${{ secrets.ZCODE_ANDROID_KEY_ALIAS || 'zcode' }}
          ZCODE_ANDROID_KEY_PASSWORD: ${{ secrets.ZCODE_ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$ZCODE_ANDROID_STORE_FILE_BASE64" ]; then
            echo "::error::Secret ZCODE_ANDROID_STORE_FILE_BASE64 is not set — cannot sign release."
            exit 1
          fi
          KEYSTORE_PATH="$GITHUB_WORKSPACE/zcode-release.jks"
          printf '%s' "$ZCODE_ANDROID_STORE_FILE_BASE64" | base64 -d > "$KEYSTORE_PATH"
          # gradle reads packages/android/keystore.properties (gitignored; generated here by CI)
          cat > packages/android/keystore.properties <<EOF
          ZCODE_ANDROID_STORE_FILE=$KEYSTORE_PATH
          ZCODE_ANDROID_STORE_PASSWORD=$ZCODE_ANDROID_STORE_PASSWORD
          ZCODE_ANDROID_KEY_ALIAS=$ZCODE_ANDROID_KEY_ALIAS
          ZCODE_ANDROID_KEY_PASSWORD=$ZCODE_ANDROID_KEY_PASSWORD
          EOF

      - name: Build signed APK and AAB
        working-directory: packages/android
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: ./gradlew --no-daemon :app:assembleRelease :app:bundleRelease

      - name: Verify signature and badging
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          set -euo pipefail
          APK="packages/android/app/build/outputs/apk/release/app-release.apk"
          APKSIGNER="$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)"
          "$APKSIGNER" verify --print-certs "$APK"
          BADGING="$(ls -d "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -1) dump badging $APK"
          $BADGING | tee /tmp/badging.txt | head -3
          grep -q "package: name='ai.zcode.mobile'" /tmp/badging.txt
          grep -qE "versionName='[0-9]+\.[0-9]+\.[0-9]+'" /tmp/badging.txt

      - name: Create or update GitHub Release with APK/AAB
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          APK="packages/android/app/build/outputs/apk/release/app-release.apk"
          AAB="packages/android/app/build/outputs/bundle/release/app-release.aab"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$TAG" "$APK" "$AAB" --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" "$APK" "$AAB" \
              --repo "$GITHUB_REPOSITORY" \
              --title "ZCode Mobile $TAG" \
              --notes "Signed release build of tag $TAG. See FORK.md / Release notes for install and provenance."
          fi

  # Optional: queue the build on Nabu APK Hub (apk.nabuxai.com). Neutral by default —
  # skipped when NABUX_APKHUB_TOKEN is not configured; also requires the app for this
  # repo to be registered on the hub side (see scripts/publish-apk-nabuxai.mjs for details).
  publish-nabux:
    runs-on: ubuntu-latest
    needs: build-release
    if: needs.build-release.outputs.nabux_enabled == 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enqueue build on Nabu APK Hub
        env:
          NABUX_APKHUB_TOKEN: ${{ secrets.NABUX_APKHUB_TOKEN }}
          NABUX_APKHUB_APP: ${{ vars.NABUX_APKHUB_APP || 'zcode-mobile' }}
        run: node scripts/publish-apk-nabuxai.mjs --enqueue
